<svg viewBox="0 0 800 258" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tenure timeline comparison. Freehold: no expiry, permanent title. Leasehold: 99-year term from state issue date, with bank financing risk arising when less than 60 years remain, and title expiry at year 99 unless renewed by the state.">
  <title>Freehold vs Leasehold — What Happens Over Time</title>
  <rect width="800" height="258" fill="#FAF9F6" rx="10"/>
  <!-- Header -->
  <rect width="800" height="42" fill="#1C1C1E" rx="10"/>
  <rect y="32" width="800" height="10" fill="#1C1C1E"/>
  <text x="400" y="27" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" fill="#C9A84C">FREEHOLD vs LEASEHOLD — WHAT HAPPENS OVER TIME</text>
  <!-- Year axis -->
  <text x="90" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">Year 0</text>
  <text x="310" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">Year 30</text>
  <text x="480" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">Year 60</text>
  <text x="650" y="62" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">Year 99</text>
  <!-- ===== FREEHOLD track ===== -->
  <text x="20" y="96" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#16a34a">Freehold</text>
  <!-- Bar -->
  <rect x="90" y="79" width="648" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="97" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#15803d">No expiry — title is permanent</text>
  <!-- Arrow extending right -->
  <line x1="738" y1="92" x2="752" y2="92" stroke="#16a34a" stroke-width="2"/>
  <polygon points="752,87 762,92 752,97" fill="#16a34a"/>
  <!-- ===== LEASEHOLD track ===== -->
  <text x="20" y="160" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#d97706">Leasehold</text>
  <!-- Base bar: year 0–99 -->
  <rect x="90" y="143" width="560" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <!-- Risk zone overlay: year 60–99 -->
  <rect x="480" y="143" width="170" height="26" rx="5" fill="#fde68a" opacity="0.7"/>
  <!-- Year 60 marker -->
  <line x1="480" y1="137" x2="480" y2="177" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Bank risk badge -->
  <rect x="398" y="174" width="164" height="22" rx="5" fill="#FEF3C7" stroke="#d97706" stroke-width="1"/>
  <text x="480" y="189" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#92400E">⚠ Bank LTV risk &lt; 60 yrs</text>
  <!-- Title text inside bar -->
  <text x="285" y="161" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#92400E">99-year term</text>
  <!-- Year 99 endpoint -->
  <line x1="650" y1="137" x2="650" y2="177" stroke="#d97706" stroke-width="2"/>
  <text x="670" y="154" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#d97706">Title expires</text>
  <text x="670" y="167" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">(unless renewed)</text>
  <!-- Renewal note -->
  <rect x="20" y="210" width="760" height="36" rx="7" fill="#F5F5F0" stroke="#E8E6E0"/>
  <text x="400" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#4A4A4C">Leasehold renewal requires state approval + premium. Not automatic. Most Malaysian states have historically renewed when applied for — not guaranteed.</text>
  <text x="400" y="241" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8C8C8E">All nine residential projects near JB CIQ on this site carry freehold strata titles. Always verify title type with the developer and solicitor before signing.</text>
</svg>
